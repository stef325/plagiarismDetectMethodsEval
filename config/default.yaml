project:
  name: plagiarism-detect-methods-eval
  version: "0.1.0"

dataset:
  name: POP909
  path: data/raw/POP909

paths:
  processed: data/processed
  transformations: data/processed/transformations
  subset: data/processed/subset
  segments: data/processed/segments
  representations: data/processed/representations
  results: data/results
  logs: logs

experiment:
  random_seed: 42

subset:
  sample_size: 100
  random_seed: 42

segments:
  measures_per_segment: 8
  segments_per_song: 2
  random_seed: 42

melody_transformations:
  random_seed: 42
  enabled:
    - transpose
    - interval_modification
    - ornamentation
    - simplification
  transpose:
    semitones: 2
  interval_modification:
    strength: 0.25
  ornamentation:
    density: 0.2
  simplification:
    strength: 0.25

harmony_transformations:
  random_seed: 42
  enabled:
    - chord_substitution
    - reharmonization
    - simplification
  chord_substitution:
    strength: 0.25
  reharmonization:
    strength: 0.25
  simplification:
    strength: 0.25

rhythm_transformations:
  random_seed: 42
  enabled:
    - tempo_change
    - duration_scaling
    - partial_rhythm_modification
  tempo_change:
    tempo_factor: 0.8
  duration_scaling:
    duration_factor: 1.2
  partial_rhythm_modification:
    strength: 0.25
