project:
  name: plagiarism-detect-methods-eval
  version: "0.1.0"

dataset:
  name: POP909
  path: data/raw/POP909

paths:
  processed: data/processed
  transformations: data/processed/transformations
  subset: data/processed/subset
  segments: data/processed/segments
  representations: data/processed/representations
  melody_transformations: data/processed/transformations/melody
  harmony_transformations: data/processed/transformations/harmony
  results: data/results
  logs: logs

experiment:
  random_seed: 42

subset:
  sample_size: 100
  random_seed: 42

segments:
  measures_per_segment: 8
  segments_per_song: 2
  random_seed: 42

melody_transformations:
  selected: transpose
  random_seed: 42
  transpose:
    semitones: 2
  interval_modification:
    strength: 0.25
  ornamentation:
    density: 0.2
  simplification:
    strength: 0.25

harmony_transformations:
  selected: chord_substitution
  random_seed: 42
  chord_substitution:
    strength: 0.25
  reharmonization:
    strength: 0.25
  simplification:
    strength: 0.25
